<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascent - live</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<div class="cam">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div class="hud">
    <div id="state" class="state warn">Starting...</div>
    <div id="detail" class="detail"></div>
  </div>
  <div class="bar">
    <button id="newBtn">New route</button>
    <button id="nextBtn">Next route</button>
    <button id="stopBtn">Stop</button>
  </div>

  <div id="setup" class="setup">
    <div class="page">
      <h1>See a route on the wall</h1>
      <label for="wall">Wall</label>
      <select id="wall"></select>
      <label for="route">Route</label>
      <select id="route"></select>
      <details>
        <summary class="muted" style="margin-top:12px">Settings for "New route"</summary>
        <label for="train">Train (comma list: reach, traverse, jug, crimp, sloper, pinch, pocket)</label>
        <input id="train" placeholder="e.g. sloper">
        <div class="row">
          <div><label for="level">Level</label>
            <select id="level"><option>easy</option><option selected>medium</option><option>hard</option></select></div>
          <div><label for="moves">Holds</label><input id="moves" type="number" value="6" min="3" max="12"></div>
          <div><label for="height">Your height, cm</label><input id="height" type="number" value="172"></div>
        </div>
      </details>
      <p><button id="startBtn" class="primary" style="width:100%">Start camera</button></p>
      <div id="error" class="error"></div>
      <p class="muted">Rings only appear while the wall is matched. If it isn't, the screen says which way
        to move - it never guesses. <a data-page="/">Other pages</a></p>
    </div>
  </div>
</div>
<script src="web/common.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("canvas");
let sid = null, running = false, lastAnswerAt = 0, wake = null;

function showInfo(info) {
  const skills = (info.train || []).join(", ") || info.made_by || "";
  $("detail").textContent = `${info.route}  ${info.grade} (estimated)  ${info.holds} holds  ${skills}` +
    (info.warnings && info.warnings.length ? "  ! " + info.warnings[0] : "") +
    (info.old_version ? "  (made on an older version of the wall)" : "");
}

function showAnswer(a) {
  const st = $("state");
  if (a.state === "locked") {
    st.textContent = "Locked"; st.className = "state locked";
  } else {
    st.textContent = a.message; st.className = "state warn";
  }
  Ascent.drawRings(canvas, video, a);        // draws nothing unless locked
  lastAnswerAt = performance.now();
}

// Never leave old rings on screen: no fresh answer for 0.6 s means nothing is drawn.
setInterval(() => { if (running && performance.now() - lastAnswerAt > 600) Ascent.fitCanvas(canvas); }, 200);

async function loop() {
  while (running) {
    const t0 = performance.now();
    const blob = await Ascent.grabFrame(video);
    if (blob) {
      try {
        showAnswer(await Ascent.api("/api/frame", blob, { sid }));
      } catch (e) {
        $("state").textContent = e.message; $("state").className = "state warn";
        Ascent.fitCanvas(canvas);
        if (/Session ended/.test(e.message)) { running = false; break; }
        await Ascent.sleep(500);
      }
    }
    await Ascent.sleep(Math.max(0, 125 - (performance.now() - t0)));   // at most 8 frames a second
  }
}

$("startBtn").onclick = async () => {
  $("error").textContent = "";
  if (!$("wall").value) { $("error").textContent = "Scan a wall first."; return; }
  $("startBtn").disabled = true;
  try {
    const info = await Ascent.api("/api/live/start", {
      wall: $("wall").value, route: $("route").value, train: $("train").value,
      level: $("level").value, moves: $("moves").value, height: $("height").value });
    sid = info.sid;
    showInfo(info);
    await Ascent.startCamera(video);
    wake = await Ascent.keepAwake();
    $("setup").classList.add("hidden");
    running = true;
    loop();
  } catch (e) {
    $("error").textContent = e.message;
  }
  $("startBtn").disabled = false;
};

async function routeButton(path, btn) {
  btn.disabled = true;
  try { showInfo(await Ascent.api(path, {}, { sid })); Ascent.fitCanvas(canvas); }
  catch (e) { $("detail").textContent = e.message; }
  btn.disabled = false;
}
$("newBtn").onclick = () => routeButton("/api/route/new", $("newBtn"));
$("nextBtn").onclick = () => routeButton("/api/route/next", $("nextBtn"));
$("stopBtn").onclick = () => {
  running = false;
  Ascent.stopCamera(video);
  Ascent.fitCanvas(canvas);
  if (wake) wake.release();
  $("setup").classList.remove("hidden");
  Ascent.fillWalls($("wall"), $("route"));
};

Ascent.fillWalls($("wall"), $("route")).catch(e => { $("error").textContent = e.message; });
</script>
</body>
</html>
